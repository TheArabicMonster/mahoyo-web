name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9, flat config)
        run: npm run lint

      - name: Check for committed assets
        run: npm run check:assets

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Check formatting (optional)
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "tools/**/*.ts" || true

  # Tests end-to-end en mode placeholders (#243) : aucun asset du jeu n'est requis, les scripts, la
  # table d'enchaînement et les images sont générés par `tests/e2e/prepare-assets.ts` avant le
  # démarrage de Vite.
  #
  # Matrice chromium + firefox (#94). Choix documenté : deux jobs en parallèle plutôt qu'un job
  # séquentiel. Le temps de mur reste celui d'un seul navigateur (~3-4 min, tôt dans la PR) au lieu
  # de la somme des deux (~6-7 min) ; le coût est de deux runners au lieu d'un, ce qui est le
  # compromis retenu pour garder la CI rapide. `fail-fast: false` pour que les deux navigateurs
  # s'exécutent toujours (un échec Firefox ne masque pas le résultat Chromium).
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Generate e2e placeholders and run the suite
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-e2e-assets

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
