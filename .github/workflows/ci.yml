name: CI

# Flux #371 (docs/CI.md) :
# - PR → `v1.1` ou `main` : `changes` (filtre de chemins) puis `build-and-test` (toujours),
#   `e2e` shardé seulement si un chemin UI/renderer/player/kag/e2e/config change, `pwa` seulement si
#   un chemin PWA change. Une PR docs/outils ne lance donc que `build-and-test` (~2 min).
# - push `v1.1` (porte d'intégration) : `build-and-test` + **e2e shardé obligatoire** (4 jobs) + pwa
#   si chemins PWA.
# - push `main` (gate légère) : `build-and-test` seul (+ `pwa` si chemins PWA) — l'e2e n'est pas
#   bloquant sur `main` ; il tourne la nuit (`e2e-nightly.yml`) et sur `v1.1`.
on:
  push:
    branches: [main, v1.1]
  pull_request:
    branches: [main, v1.1]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Calcule les filtres de chemins. Pour une PR, l'action compare la PR à sa base via l'API ;
  # pour un push, on compare au commit précédent (`github.event.before`, merge de vague).
  changes:
    name: changes (filtre de chemins)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      pwa: ${{ steps.filter.outputs.pwa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # nécessaire pour que `dorny/paths-filter` puisse faire le diff sur les pushs
          fetch-depth: 0

      - name: Filtre de chemins (e2e, pwa)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            e2e:
              - 'src/renderer/**'
              - 'src/ui/**'
              - 'src/player/**'
              - 'src/kag/**'
              - 'tests/e2e/**'
              - 'vite.config.ts'
              - 'playwright.config.ts'
              - 'playwright.pwa.config.ts'
              - 'index.html'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            pwa:
              - 'public/**'
              - 'src/pwa/**'
              - 'tools/pwa-sw.ts'
              - 'src/main.ts'
              - 'vite.config.ts'
              - 'playwright.pwa.config.ts'
              - 'tests/e2e/pwa.spec.ts'
              - 'package.json'
              - 'package-lock.json'

  # Gates existants inchangés (lint, assets, marqueurs de conflit, build, unit, intégration,
  # full read, audit zéro strict, check:generated). Toujours exécuté, y compris sur push `main`.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9, flat config)
        run: npm run lint

      - name: Check for committed assets
        run: npm run check:assets

      - name: Check for Git conflict markers (#342)
        run: npm run check:conflict-markers

      - name: Build
        run: npm run build

      # Budgets de performance (#100) : mesure statique (tailles de bundle gzip) sur le dist déjà
      # construit, volontairement non bloquante (--warn-only + continue-on-error) le temps de
      # calibrer les runners. La mesure complète (premier rendu, fps, mémoire) reste locale :
      # `npm run perf` — elle dépend de la machine et de la charge du runner.
      - name: Performance budgets (non-blocking, static)
        continue-on-error: true
        run: npm run perf -- --no-build --static-only --warn-only

      - name: Run unit tests
        run: npm run test:unit

      # Vérifie d'abord le comportement d'un checkout nu : les tests d'intégration se skippent
      # proprement (aucun `public/assets`, exit 0) — non-régression du correctif #269.
      - name: Integration tests skip cleanly without assets
        run: npm run test:integration

      # Génère un corpus de placeholders originaux (aucun asset du jeu) puis exécute la même logique
      # de lecture complète que le corpus réel (DoD v1.0 : « la CI exécute la même logique de lecture
      # avec des placeholders et reste verte »). Le corpus est paramétrable via
      # MAHOYO_FULL_READ_SCRIPTS (défaut 221, taille du corpus de référence) ; il est écrit dans le
      # dossier temporaire du runner et jamais commité.
      - name: Generate placeholder corpus for full read
        run: npm run corpus:full-read
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-full-read
          MAHOYO_FULL_READ_SCRIPTS: "221"

      - name: Full read of the placeholder corpus (221 scripts)
        run: npm run test:full-read
        env:
          MAHOYO_ASSETS_DIR: ${{ runner.temp }}/mahoyo-full-read/assets

      # Garde-fou du registre de commandes KAG — mode zéro strict (#275, #302) :
      # registre des no-ops justifiés valide, baseline vide, doc générée à jour, et
      # AUCUNE commande inconnue sur le corpus de placeholders. Le mécanisme de
      # décroissance (comparaison à origin/main) a été supprimé à la clôture v1.0.
      - name: Audit command registry guard (zero-strict)
        run: npm run audit:guard -- --strict
        env:
          MAHOYO_ASSETS_DIR: ${{ runner.temp }}/mahoyo-full-read/assets

      # Garde-fous de clôture DoD (#295) :
      # - doc générée à jour (LECTURE_COMPLETE) : `audit:doc` régénère sans assets puis échoue si
      #   le fichier committé diverge ;
      # - registre des approximations valide (4 éléments, tests figés, compteurs non croissants).
      # Depuis la clôture v1.0 (#302), le mode zéro strict s'applique : la baseline est figée
      # vide (plus de `npm run audit:baseline`) et toute commande inconnue fait échouer
      # `audit:guard` ; le corpus de clôture a été vérifié localement avec les vrais assets
      # (0 inconnue).
      - name: Check generated artifacts and approximations registry (#295)
        run: npm run check:generated

      - name: Check formatting (optional)
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "tools/**/*.ts" || true

  # PWA / hors ligne (#96) : build de production + service worker généré, servi par `vite preview`
  # (le SW n'est enregistré qu'en production). Chromium uniquement : l'installation PWA n'est pas
  # standardisée sur Firefox/Linux ; le manifeste, le service worker, les caches et la relecture
  # hors ligne (`context.setOffline`) sont vérifiés dans Chromium, navigateur de référence PWA.
  # Conditionnel : ne tourne que si un chemin PWA change (#371).
  pwa:
    name: pwa (offline)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: PWA manifest + offline e2e (Chromium)
        run: npm run test:e2e:pwa
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-pwa-assets

  # Tests end-to-end en mode placeholders (#243) : aucun asset du jeu n'est requis, les scripts, la
  # table d'enchaînement et les images sont générés par `tests/e2e/prepare-assets.ts` avant le
  # démarrage de Vite.
  #
  # Shards (#371) : chaque navigateur est coupé en 2 shards (`--shard=1/2`, `2/2`), donc 4 jobs
  # parallèles (~3-4 min chacun au lieu de ~9-12 min pour un navigateur entier). `fail-fast: false`
  # pour que tous les shards s'exécutent toujours. Les shards ne changent pas la couverture : la
  # somme des tests des deux shards = la suite complète du projet.
  #
  # Conditionnel : chemins e2e/UI/config uniquement, MAIS obligatoire sur push `v1.1` (porte
  # d'intégration) quel que soit le diff. Jamais sur push `main` (gate légère : build-and-test seul).
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/2)
    needs: changes
    if: >-
      needs.changes.result == 'success' && (needs.changes.outputs.e2e == 'true' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/v1.1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Le `--grep-invert` éventuel est porté par le projet Playwright (playwright.config.ts), donc
      # `--project` le conserve automatiquement.
      - name: Generate e2e placeholders and run the suite (${{ matrix.browser }} ${{ matrix.shard }}/2)
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-e2e-assets

      # Mesure du débordement du texte (#319) : outil de diagnostic, volontairement non bloquant.
      # Mode placeholders (aucun asset du jeu) → rapport PARTIEL qui vérifie l'outil ; la mesure du
      # vrai corpus se fait en local avec MAHOYO_ASSETS_DIR (voir docs/TEXTE_DEBORDEMENT.md).
      # Lancé une seule fois (Chromium, shard 1/2) pour ne pas dupliquer le rapport.
      - name: Text overflow report (placeholders, non-blocking)
        if: matrix.browser == 'chromium' && matrix.shard == 1
        continue-on-error: true
        run: npm run text:overflow -- --placeholders --browsers chromium --max-pages 400

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
