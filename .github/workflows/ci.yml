name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint 9, flat config)
        run: npm run lint

      - name: Check for committed assets
        run: npm run check:assets

      - name: Build
        run: npm run build

      # Budgets de performance (#100) : mesure statique (tailles de bundle gzip) sur le dist déjà
      # construit, volontairement non bloquante (--warn-only + continue-on-error) le temps de
      # calibrer les runners. La mesure complète (premier rendu, fps, mémoire) reste locale :
      # `npm run perf` — elle dépend de la machine et de la charge du runner.
      - name: Performance budgets (non-blocking, static)
        continue-on-error: true
        run: npm run perf -- --no-build --static-only --warn-only

      - name: Run unit tests
        run: npm run test:unit

      # Vérifie d'abord le comportement d'un checkout nu : les tests d'intégration se skippent
      # proprement (aucun `public/assets`, exit 0) — non-régression du correctif #269.
      - name: Integration tests skip cleanly without assets
        run: npm run test:integration

      # Génère un corpus de placeholders originaux (aucun asset du jeu) puis exécute la même logique
      # de lecture complète que le corpus réel (DoD v1.0 : « la CI exécute la même logique de lecture
      # avec des placeholders et reste verte »). Le corpus est paramétrable via
      # MAHOYO_FULL_READ_SCRIPTS (défaut 221, taille du corpus de référence) ; il est écrit dans le
      # dossier temporaire du runner et jamais commité.
      - name: Generate placeholder corpus for full read
        run: npm run corpus:full-read
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-full-read
          MAHOYO_FULL_READ_SCRIPTS: "221"

      - name: Full read of the placeholder corpus (221 scripts)
        run: npm run test:full-read
        env:
          MAHOYO_ASSETS_DIR: ${{ runner.temp }}/mahoyo-full-read/assets

      # Garde-fou du registre de commandes KAG — mode zéro strict (#275, #302) :
      # registre des no-ops justifiés valide, baseline vide, doc générée à jour, et
      # AUCUNE commande inconnue sur le corpus de placeholders. Le mécanisme de
      # décroissance (comparaison à origin/main) a été supprimé à la clôture v1.0.
      - name: Audit command registry guard (zero-strict)
        run: npm run audit:guard -- --strict
        env:
          MAHOYO_ASSETS_DIR: ${{ runner.temp }}/mahoyo-full-read/assets

      # Garde-fous de clôture DoD (#295) :
      # - doc générée à jour (LECTURE_COMPLETE) : `audit:doc` régénère sans assets puis échoue si
      #   le fichier committé diverge ;
      # - registre des approximations valide (4 éléments, tests figés, compteurs non croissants).
      # Depuis la clôture v1.0 (#302), le mode zéro strict s'applique : la baseline est figée
      # vide (plus de `npm run audit:baseline`) et toute commande inconnue fait échouer
      # `audit:guard` ; le corpus de clôture a été vérifié localement avec les vrais assets
      # (0 inconnue).
      - name: Check generated artifacts and approximations registry (#295)
        run: npm run check:generated

      - name: Check formatting (optional)
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts" "tools/**/*.ts" || true

  # Tests end-to-end en mode placeholders (#243) : aucun asset du jeu n'est requis, les scripts, la
  # table d'enchaînement et les images sont générés par `tests/e2e/prepare-assets.ts` avant le
  # démarrage de Vite.
  #
  # Matrice chromium + firefox (#94). Choix documenté : deux jobs en parallèle plutôt qu'un job
  # séquentiel. Le temps de mur reste celui d'un seul navigateur (~3-4 min, tôt dans la PR) au lieu
  # de la somme des deux (~6-7 min) ; le coût est de deux runners au lieu d'un, ce qui est le
  # compromis retenu pour garder la CI rapide. `fail-fast: false` pour que les deux navigateurs
  # s'exécutent toujours (un échec Firefox ne masque pas le résultat Chromium).
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Generate e2e placeholders and run the suite
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          MAHOYO_E2E_ASSETS: ${{ runner.temp }}/mahoyo-e2e-assets

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
